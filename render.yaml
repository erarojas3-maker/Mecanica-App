databases:
  - name: taller-mecanico-db
    plan: free
    databaseName: taller_mecanico
    user: taller_mecanico

services:
  - type: web
    name: taller-mecanico-app
    runtime: node
    plan: free
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/index.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taller-mecanico-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.11.0
